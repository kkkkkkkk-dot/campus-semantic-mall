server:
  port: 8086
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/yami_shops?allowMultiQueries=true&useSSL=false&useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=GMT%2B8&nullCatalogMeansCurrent=true&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      minimum-idle: 0
      maximum-pool-size: 20
      idle-timeout: 10000
      connection-test-query: select 1
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
logging:
  config: classpath:logback/logback-dev.xml
  mall4j:
    ai:
      deepseek:
        api-key: ${DEEPSEEK_API_KEY:}
        base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
        model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
        temperature: ${DEEPSEEK_TEMPERATURE:0.0}
        max-tokens: ${DEEPSEEK_MAX_TOKENS:800}
        timeout: ${DEEPSEEK_TIMEOUT:15s}
        max-retries: ${DEEPSEEK_MAX_RETRIES:2}